{% extends "master.html" %}

{% block title %}
  My Tennis Club - List of all members
{% endblock %}


{% block content %}
  <div class="mycard" onclick="window.location = 'details/'" style="cursor: pointer;" role="application" onkeydown="handleKeyDown(event)">
    <h1>Members</h1>
    <ul>
      {% for x in mymembers %}
        <li><a href="details/{{ x.slug }}" style="text-decoration:none;">{{ x.firstname }} {{ x.lastname }}</a> </li>
      {% endfor %}
    </ul>
  </div>
{% endblock %}
